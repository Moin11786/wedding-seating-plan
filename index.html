<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wedding Seating Plan</title>
    <meta name="description" content="Find your wedding table by searching your name.">
    <style>
        :root {
            --text: #2f302d;
            --muted: #777872;
            --accent: #8b7562;
            --accent-dark: #705d4e;
            --border: #e4dfd7;
            /* Transparency of the main search panel */
            --panel: #fffaf5;
            /* Transparency of the photos */
            --photo-opacity: 0.82;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            min-height: 100%;
        }

        body {
            min-height: 100vh;
            background: #eee9e2;
            color: var(--text);
            font-family: Georgia, "Times New Roman", serif;
        }

        /* =========================================================
       BACKGROUND PHOTOS
       ========================================================= */
        .background {
            position: fixed;
            inset: 0;
            display: flex;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 0;
            background: #eee9e2;
            align-items: center;
        }

        .background-photo {
            width: 50%;
            height: 100%;
            background-size: cover;
            background-repeat: no-repeat;
            opacity: var(--photo-opacity);
            filter: saturate(0.82);
        }

        /*
      BRIDE PHOTO
      File must be called:
      bride-childhood.jpg
    */
        .bride {
            background-image: url("Zaynah.jpg");
            background-position: center center;
        }

        /*
      GROOM PHOTO
      File must be called:
      groom-childhood.jpg
    */
        .groom {
            background-image: url("Moin.jpg");
            background-position: center top;
        }

        /*
      Very subtle white overlay helps keep text readable.
    */
        .background::after {
            content: "";
            position: absolute;
            inset: 0;
            pointer-events: none;

            background:
                linear-gradient(90deg,
                    rgba(255, 255, 255, 0.08) 0%,
                    rgba(255, 255, 255, 0.18) 35%,
                    rgba(255, 255, 255, 0.32) 50%,
                    rgba(255, 255, 255, 0.18) 65%,
                    rgba(255, 255, 255, 0.08) 100%);
        }

        /* =========================================================
       MAIN PAGE
       ========================================================= */
        .page {
            position: relative;
            z-index: 1;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 32px 18px;
        }

        .container {
            width: 100%;
            max-width: 560px;
            text-align: center;
        }

        /* =========================================================
       WEDDING HEADING
       ========================================================= */
        .eyebrow {
            margin: 0 0 10px;
            color: var(--accent);
            font-family: Arial, sans-serif;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.2em;
            text-transform: uppercase;
        }

        h1 {
            margin: 0;
            font-size: clamp(38px, 9vw, 58px);
            font-weight: 400;
            line-height: 1.05;
        }

        .intro {
            max-width: 420px;
            margin: 16px auto 0;
            color: var(--muted);
            font-family: Arial, sans-serif;
            font-size: 16px;
            line-height: 1.6;
        }

        /* =========================================================
       SEARCH PANEL
       ========================================================= */
        .search-card {
            margin-top: 32px;
            padding: 24px;
            background: var(--panel);
            border: 1px solid rgba(255, 255, 255, 0.75);
            border-radius: 18px;
            box-shadow:
                0 12px 40px rgba(60, 50, 40, 0.12);
        }

        label {
            display: block;
            margin-bottom: 10px;
            text-align: left;
            font-family: Arial, sans-serif;
            font-size: 14px;
            font-weight: 700;
        }

        .search-row {
            display: flex;
            gap: 10px;
        }

        input {
            min-width: 0;
            flex: 1;
            min-height: 50px;
            padding: 0 15px;
            border: 1px solid var(--border);
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.96);
            color: var(--text);
            font-family: Arial, sans-serif;
            font-size: 16px;
            outline: none;
        }

        input::placeholder {
            color: #999a94;
        }

        input:focus {
            border-color: var(--accent);
            box-shadow:
                0 0 0 3px rgba(139, 117, 98, 0.15);
        }

        button {
            min-height: 50px;
            padding: 0 18px;
            border: 0;
            border-radius: 10px;
            background: var(--accent);
            color: white;
            cursor: pointer;
            font-family: Arial, sans-serif;
            font-size: 15px;
            font-weight: 700;
            transition:
                background 0.2s ease,
                transform 0.1s ease;
        }

        button:hover {
            background: var(--accent-dark);
        }

        button:active {
            transform: translateY(1px);
        }

        /* =========================================================
       SEARCH MESSAGE
       ========================================================= */
        .message {
            min-height: 24px;
            margin: 14px 0 0;
            color: #a14e4e;
            font-family: Arial, sans-serif;
            font-size: 14px;
        }

        /* =========================================================
       RESULT
       ========================================================= */
        .result {
            display: none;
            margin-top: 20px;
            padding: 28px 20px;
            background: rgba(248, 244, 239, 0.94);
            border: 1px solid var(--border);
            border-radius: 16px;
        }

        .result.visible {
            display: block;
        }

        .welcome {
            margin: 0;
            color: var(--muted);
            font-family: Arial, sans-serif;
            font-size: 14px;
        }

        .guest-name {
            margin: 6px 0 20px;
            font-size: 25px;
            font-weight: 400;
        }

        .table-label {
            margin: 0;
            color: var(--muted);
            font-family: Arial, sans-serif;
            font-size: 14px;
        }

        .table-number {
            margin: 5px 0 0;
            font-size: 48px;
            font-weight: 400;
            line-height: 1.1;
        }

        /* =========================================================
       FOOTER
       ========================================================= */
        .footer {
            margin-top: 28px;
            color: #64655f;
            font-family: Arial, sans-serif;
            font-size: 13px;
        }

        /* =========================================================
       MOBILE
       ========================================================= */
        @media (max-width: 520px) {
            .page {
                padding: 22px 12px;
            }

            /*
        Keep the photos side-by-side on mobile.
        They never stack.
      */
            .background-photo {
                width: 50%;
                opacity: 0.50;
                height: 70%;
            }

            /*
        Slightly increase the centre wash on small screens
        so the search box remains easy to read.
      */
            .background::after {
                background:
                    linear-gradient(90deg,
                        rgba(255, 255, 255, 0.12),
                        rgba(255, 255, 255, 0.40) 50%,
                        rgba(255, 255, 255, 0.12));
            }

            .search-card {
                padding: 18px;
                background: none;
            }

            /*
        The input and button stack on small phones.
      */
            .search-row {
                flex-direction: column;
            }

            button {
                width: 100%;
            }

            /*
        Slightly smaller result text on narrow phones.
      */
            .table-number {
                font-size: 42px;
            }
        }

        /* =========================================================
       ACCESSIBILITY
       ========================================================= */
        @media (prefers-reduced-transparency: reduce) {
            .background-photo {
                opacity: 0.16;
            }

            .search-card {
                background: rgba(255, 255, 255, 0.97);
                backdrop-filter: none;
                -webkit-backdrop-filter: none;
            }
        }
    </style>
</head>

<body>

    <!-- =========================================================
       BACKGROUND PHOTOS

       Put these two files in the SAME folder as index.html:

       bride-childhood.jpg
       groom-childhood.jpg

       If your filenames are different, change the filenames
       in the CSS above.
       ========================================================= -->

    <div class="background" aria-hidden="true">
        <div class="background-photo groom"></div>
        <div class="background-photo bride"></div>
    </div>

    <!-- =========================================================
       MAIN CONTENT
       ========================================================= -->

    <main class="page">
        <section class="container" aria-labelledby="page-title">
            <p class="eyebrow">
                Welcome to the wedding of Moinuddin & Zaynah
            </p>
            <h1 id="page-title">
                Find Your Seat
            </h1>
            <p class="intro">
                Enter your name below and we'll show you
                which table you've been seated at.
            </p>

            <!-- SEARCH -->

            <div class="search-card">
                <form id="seating-form">
                    <label for="guest-name">
                        Your name
                    </label>
                    <div class="search-row">
                        <input id="guest-name" name="guest-name" type="search" placeholder="e.g. Emma Smith"
                            autocomplete="off" required>
                        <button type="submit">
                            Find my table
                        </button>
                    </div>
                </form>

                <!-- Error / information message -->

                <p id="message" class="message" aria-live="polite"></p>

                <!-- TABLE RESULT -->

                <div id="result" class="result" aria-live="polite">
                    <p class="welcome">
                        Welcome to the wedding!
                    </p>
                    <p id="guest-result" class="guest-name"></p>
                    <p class="table-label">
                        Your table is
                    </p>
                    <p id="table-result" class="table-number"></p>
                </div>
            </div>
            <p class="footer">
                We hope you have a wonderful celebration.
            </p>
        </section>
    </main>

    <!-- =========================================================
       GUEST DATA + SEARCH FUNCTION
       ========================================================= -->

    <script>
        /*
          ============================================================
          YOUR GUEST LIST
          ============================================================
    
          Replace the example names below with your real guests.
    
          Example:
    
          { name: "Jane Smith", table: "Table 4" }
    
          The search is NOT case-sensitive.
    
          You can also use table names instead of numbers:
    
          { name: "Jane Smith", table: "The Rose Table" }
    
          ============================================================
        */

        const guests = [
            { name: "Emma Smith", table: "Table 1" },
            { name: "David Smith", table: "Table 1" },
            { name: "Olivia Jones", table: "Table 2" },
            { name: "Michael Jones", table: "Table 2" },
            { name: "Sophie Williams", table: "Table 3" },
            { name: "James Williams", table: "Table 3" },
            { name: "Charlotte Brown", table: "Table 4" },
            { name: "Thomas Brown", table: "Table 4" }
        ];
        /* =========================================================
           GET PAGE ELEMENTS
           ========================================================= */

        const form =
            document.getElementById("seating-form");
        const input =
            document.getElementById("guest-name");
        const message =
            document.getElementById("message");
        const result =
            document.getElementById("result");
        const guestResult =
            document.getElementById("guest-result");
        const tableResult =
            document.getElementById("table-result");
        /* =========================================================
           NORMALISE NAME
    
           This means:
    
           "Emma Smith"
           "emma smith"
           "  Emma   Smith  "
    
           will all be treated as the same search.
           ========================================================= */

        function normaliseName(name) {
            return name
                .trim()
                .toLowerCase()
                .replace(/\s+/g, " ");
        }
        /* =========================================================
           SEARCH
           ========================================================= */

        form.addEventListener("submit", function (event) {
            event.preventDefault();
            const search =
                normaliseName(input.value);
            /*
              Clear previous result/message.
            */
            message.textContent = "";
            result.classList.remove("visible");
            /*
              Empty search.
            */
            if (!search) {
                message.textContent =
                    "Please enter your name.";
                input.focus();
                return;
            }
            /*
              Find matching guest.
            */
            const guest = guests.find(function (person) {
                return (
                    normaliseName(person.name) === search
                );
            });
            /*
              Guest found.
            */
            if (guest) {
                guestResult.textContent =
                    guest.name;
                tableResult.textContent =
                    guest.table;
                result.classList.add("visible");
            }
            /*
              Guest not found.
            */
            else {
                message.textContent =
                    "We couldn't find that name. Please check the spelling and try again.";
            }
        });
    </script>
</body>
</html>
